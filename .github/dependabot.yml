version: 2
updates:
  - package-ecosystem: composer
    directory: /SkinCare
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
