name: Visual Regression CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'SkinCare/**'
      - 'e2e/**'
      - '.github/workflows/visual-regression-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'SkinCare/**'
      - 'e2e/**'
      - '.github/workflows/visual-regression-ci.yml'

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sharafi_visual
          POSTGRES_USER: sharafi
          POSTGRES_PASSWORD: sharafi_visual_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharafi -d sharafi_visual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      APP_KEY: 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
      OTP_PEPPER: 'ci-only-visual-otp-pepper-that-is-at-least-32-characters'
      SMS_DRIVER: e2e
      PAYMENT_DRIVER: e2e
      PAYMENT_CALLBACK_URL: http://127.0.0.1:8000/api/v1/payments/zarinpal/callback
      PAYMENT_RESULT_URL: http://127.0.0.1:8000/payment-result.html
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sharafi_visual
      DB_USERNAME: sharafi
      DB_PASSWORD: sharafi_visual_password
      DB_SSLMODE: disable
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'false'
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, openssl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: SkinCare
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit backend dependencies
        working-directory: SkinCare
        run: composer audit --locked

      - name: Install locked browser dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser dependencies
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Install Chromium and image comparison runtime
        working-directory: e2e
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Prepare deterministic fixtures
        working-directory: SkinCare
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --class=E2ESeeder --force

      - name: Mount storefront into Laravel public root
        run: rsync -a frontend/ SkinCare/public/

      - name: Start Laravel visual server
        working-directory: SkinCare
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/visual-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/visual-server.log
          exit 1

      - name: Capture deterministic visual surfaces
        working-directory: e2e
        run: npx playwright test tests/visual.spec.js

      - name: Compare approved visual fingerprints
        working-directory: e2e
        run: >-
          python3 visual/compare_visual.py
          --baseline visual/baselines.json
          --current-dir test-results/visual-current

      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharafi-visual-regression-failure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            e2e/test-results/visual-current/
            SkinCare/storage/logs/visual-server.log
