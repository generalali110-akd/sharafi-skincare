name: Staging Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    defaults:
      run:
        working-directory: SkinCare

    env:
      APP_ENV: staging
      APP_DEBUG: 'false'
      APP_KEY: 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
      APP_URL: ${{ vars.STAGING_APP_URL }}
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: 'true'
      SMS_DRIVER: smsir
      SMSIR_API_KEY: ${{ secrets.SMSIR_API_KEY }}
      SMSIR_SANDBOX: ${{ vars.SMSIR_SANDBOX || 'true' }}
      SMSIR_OTP_TEMPLATE_ID: ${{ vars.SMSIR_OTP_TEMPLATE_ID }}
      SMSIR_OTP_CODE_PARAMETER: ${{ vars.SMSIR_OTP_CODE_PARAMETER || 'CODE' }}
      SMSIR_LINE_NUMBER: ${{ vars.SMSIR_LINE_NUMBER }}
      PAYMENT_DRIVER: zarinpal
      ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}
      ZARINPAL_SANDBOX: ${{ vars.ZARINPAL_SANDBOX || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, openssl
          coverage: none
          tools: composer:v2

      - name: Install locked production dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Validate staging provider configuration and SMS.ir credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_URL:?STAGING_APP_URL environment variable is required}"
          export PAYMENT_CALLBACK_URL="${APP_URL%/}/api/v1/payments/zarinpal/callback"
          export PAYMENT_RESULT_URL="${APP_URL%/}/payment-result.html"
          php artisan ops:provider-readiness --probe-smsir --json
