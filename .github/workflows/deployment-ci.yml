name: Deployment CI

on:
  push:
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - 'SkinCare/.env.staging.example'
      - 'SkinCare/composer.json'
      - 'SkinCare/composer.lock'
      - '.github/workflows/deployment-ci.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - 'SkinCare/.env.staging.example'
      - 'SkinCare/composer.json'
      - 'SkinCare/composer.lock'
      - '.github/workflows/deployment-ci.yml'

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n deploy/php/entrypoint.sh
          sh -n deploy/staging/deploy.sh
          sh -n deploy/staging/http-smoke.sh
          sh -n deploy/backup/entrypoint.sh
          sh -n deploy/backup/backup.sh
          sh -n deploy/backup/restore-verify.sh

      - name: Enforce strict CSP policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Content-Security-Policy' deploy/caddy/Caddyfile
          grep -Fq "default-src 'self'" deploy/caddy/Caddyfile
          grep -Fq "script-src 'self'" deploy/caddy/Caddyfile
          grep -Fq "style-src 'self'" deploy/caddy/Caddyfile
          grep -Fq "object-src 'none'" deploy/caddy/Caddyfile
          if grep -E 'Content-Security-Policy.*unsafe-(inline|eval)' deploy/caddy/Caddyfile; then
            echo 'CSP must not permit unsafe-inline or unsafe-eval.' >&2
            exit 1
          fi

      - name: Prepare non-secret compose validation environment
        shell: bash
        run: |
          set -euo pipefail
          cp SkinCare/.env.staging.example SkinCare/.env.staging
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=|' SkinCare/.env.staging
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-staging-password|' SkinCare/.env.staging
          sed -i 's|^OTP_PEPPER=.*|OTP_PEPPER=ci-only-otp-pepper-that-is-at-least-32-characters|' SkinCare/.env.staging
          sed -i 's|^SMSIR_API_KEY=.*|SMSIR_API_KEY=ci-only-placeholder|' SkinCare/.env.staging
          sed -i 's|^SMSIR_LINE_NUMBER=.*|SMSIR_LINE_NUMBER=30004505000017|' SkinCare/.env.staging
          sed -i 's|^ZARINPAL_MERCHANT_ID=.*|ZARINPAL_MERCHANT_ID=12345678-1234-1234-1234-123456789abc|' SkinCare/.env.staging
          sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=ci|' SkinCare/.env.staging
          chmod 600 SkinCare/.env.staging

      - name: Validate Compose model
        run: docker compose --env-file SkinCare/.env.staging -f deploy/staging/compose.yml config --quiet

      - name: Build application, web, and backup images
        run: docker compose --env-file SkinCare/.env.staging -f deploy/staging/compose.yml build app web backup

      - name: Validate PHP runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php sharafi-skincare-app:ci -m | grep -Fx 'pdo_pgsql'
          docker run --rm --entrypoint php sharafi-skincare-app:ci -m | grep -Fx 'mbstring'
          docker run --rm --entrypoint php sharafi-skincare-app:ci -m | grep -Fx 'Zend OPcache'
          docker run --rm \
            -e APP_KEY='base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' \
            -e APP_ENV=staging \
            -e APP_URL=https://staging.example.com \
            sharafi-skincare-app:ci php artisan --version

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e STAGING_DOMAIN=staging.example.com
          -e ACME_EMAIL=ops@example.com
          sharafi-skincare-web:ci
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Exercise migrations, application, backup, and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose --env-file SkinCare/.env.staging -f deploy/staging/compose.yml "$@"
          }

          compose up -d db

          db_ready=false
          for attempt in $(seq 1 30); do
            if compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              db_ready=true
              break
            fi
            sleep 2
          done

          if [ "$db_ready" != true ]; then
            compose logs --no-color db
            exit 1
          fi

          compose run --rm app php artisan migrate --force --no-interaction
          compose up -d app

          app_ready=false
          for attempt in $(seq 1 30); do
            app_id=$(compose ps -q app)
            if [ -n "$app_id" ]; then
              app_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$app_id" 2>/dev/null || true)
              if [ "$app_status" = healthy ]; then
                app_ready=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$app_ready" != true ]; then
            compose logs --no-color app
            exit 1
          fi

          compose exec -T app php artisan ops:provider-readiness --json

          mkdir -p .ci-backup-key
          docker run --rm \
            -v "$PWD/.ci-backup-key:/work" \
            --entrypoint age-keygen \
            sharafi-skincare-backup:ci \
            -o /work/identity.txt
          recipient=$(docker run --rm \
            -v "$PWD/.ci-backup-key:/work:ro" \
            --entrypoint age-keygen \
            sharafi-skincare-backup:ci \
            -y /work/identity.txt)

          compose run --rm \
            -e BACKUP_AGE_RECIPIENT="$recipient" \
            --entrypoint /usr/local/bin/sharafi-backup \
            backup

          compose run --rm \
            -v "$PWD/.ci-backup-key:/identity:ro" \
            -e BACKUP_AGE_IDENTITY_FILE=/identity/identity.txt \
            --entrypoint /bin/sh \
            backup \
            -c 'latest=$(ls -1t /backups/sharafi-*.dump.age | head -n 1); /usr/local/bin/sharafi-restore-verify "$latest"'

      - name: Cleanup staging containers
        if: always()
        run: docker compose --env-file SkinCare/.env.staging -f deploy/staging/compose.yml down --volumes --remove-orphans
