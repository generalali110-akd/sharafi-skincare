name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "/tmp/$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          chmod 0755 /tmp/gitleaks
          /tmp/gitleaks version

      - name: Scan repository history for secrets
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gitleaks-results
          /tmp/gitleaks git \
            --redact=100 \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-results/report.json \
            .

      - name: Upload redacted diagnostics
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-findings
          if-no-files-found: error
          retention-days: 7
          path: gitleaks-results/report.json

      - name: Enforce clean secret scan
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1
