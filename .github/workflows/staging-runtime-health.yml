name: Staging Runtime Health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-runtime-health
  cancel-in-progress: false

jobs:
  runtime-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Validate staging connection metadata
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST_KEY: ${{ secrets.STAGING_SSH_HOST_KEY }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${STAGING_SSH_HOST:?STAGING_SSH_HOST secret is required}"
          : "${STAGING_SSH_USER:?STAGING_SSH_USER secret is required}"
          : "${STAGING_SSH_PRIVATE_KEY:?STAGING_SSH_PRIVATE_KEY secret is required}"
          : "${STAGING_SSH_HOST_KEY:?STAGING_SSH_HOST_KEY secret is required}"
          : "${STAGING_DEPLOY_PATH:?STAGING_DEPLOY_PATH environment variable is required}"
          [[ "$STAGING_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'Invalid STAGING_DEPLOY_PATH.' >&2; exit 2; }

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_HOST_KEY: ${{ secrets.STAGING_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check deployed runtime health
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          remote="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          compose='docker compose --env-file SkinCare/.env.staging -f deploy/staging/compose.yml'
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$remote" \
            "cd '$STAGING_DEPLOY_PATH' && $compose exec -T app php artisan ops:runtime-health --json"
