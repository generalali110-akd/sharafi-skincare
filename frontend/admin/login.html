<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به پنل مدیریت | شرفی</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--rose-light),var(--cream));}
  .login-box{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:40px;width:100%;max-width:380px;text-align:center;}
  .login-box .logo{font-size:26px;font-weight:800;color:var(--rose-dark);margin-bottom:6px;}
  .login-box p{color:var(--text-light);font-size:13.5px;margin-bottom:28px;}
  .login-box .form-field{text-align:right;margin-bottom:16px;}
  .login-box label{font-size:13px;font-weight:600;color:var(--text-light);display:block;margin-bottom:6px;}
  .login-box input{width:100%;border:1px solid #f0dde2;border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;background:var(--cream);}
</style>
</head>
<body>
  <div class="login-box">
    <div class="logo">شرفی<span style="color:var(--gold);">.</span></div>
    <p style="margin-bottom:10px;">ورود به پنل مدیریت فروشگاه</p>
    <p style="font-size:11.5px;color:var(--text-light);margin-bottom:24px;">📅 <span class="js-live-date"></span> · 🕐 <span class="js-live-time" style="direction:ltr;unicode-bidi:isolate;"></span></p>
    <form onsubmit="event.preventDefault(); location.href='dashboard.html';">
      <div class="form-field">
        <label>نام کاربری یا ایمیل</label>
        <input type="text" required placeholder="admin@sharafiskincare.ir">
      </div>
      <div class="form-field">
        <label>رمز عبور</label>
        <input type="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">ورود به پنل</button>
    </form>
    <p style="margin-top:20px;font-size:12px;">این صفحه نمونه است — در نسخه نهایی به سیستم کاربری وردپرس متصل می‌شود</p>
  </div>
<script src="../assets/js/clock.js"></script>
</body>
</html>
